name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8 # tmux renders the glyphs and matches the braille spinner only in a UTF-8 locale
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install tmux
        run: sudo apt-get update -q && sudo apt-get install -yq tmux
      - name: Syntax
        run: |
          for script in pitwall.tmux bin/pitwall bin/pitwall-hook bin/pitwall-tick bin/pitwall-sys lib/pitwall-features.sh test/run.sh; do
            sh -n "$script" || exit 1
          done
          bash -n bin/pitwall-dash
          python3 -m py_compile bin/pitwall-stats bin/pitwall-quota bin/pitwall-usage bin/pitwall-handoff lib/pitwall_panel.py plugins/opentimeline/bin/opentimeline test/panels.py
      - name: Checks
        run: test/run.sh
